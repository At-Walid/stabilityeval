name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check stability_eval tests scripts

      - name: Tests (replay mode only, no API key needed or used)
        run: pytest -v --tb=short
