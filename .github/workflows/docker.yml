name: Docker image

# Builds the image when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0),
# checks that it runs without any API key, and pushes ghcr.io/<owner>/stableagent with the tags
# <version> (1.0.0), the git tag (v1.0.0) and latest, using the workflow's GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stableagent" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stableagent:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (no API key)
        run: |
          docker run --rm stableagent:smoke-test stableagent --help
          docker run --rm stableagent:smoke-test \
            stableagent run --config configs/icse_pilot.json --estimate

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
