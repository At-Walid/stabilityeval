[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stableagent"
version = "1.0.0"
description = "Behavioral stability evaluation of autonomous SE agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Exact pins for a reproducible install are in requirements.txt (runtime) and
# requirements-dev.txt (tests and linting).
dependencies = [
    "anthropic>=0.28",
    "datasets>=2.19",          # only to download SWE-bench Lite (the app reads the bundled copy)
    "matplotlib>=3.8",         # the paper's RQ2 figure (export/figures.py), also in the dashboard
    "numpy>=1.24",             # bootstrap CIs of the changed-line similarity (metrics/statistics.py)
    "openai>=1.45",            # the LLM Baseline with provider "openai" (agents/llm_baseline.py)
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",              # CLI output
    "sqlalchemy>=2.0",
    "streamlit>=1.35",
    "truststore>=0.9",         # OS certificate store behind TLS-intercepting proxies
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
stableagent = "stableagent.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["stableagent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Streamlit entry points add the repository root to sys.path before importing the package.
"stableagent/dashboard/StableAgent.py" = ["E402"]
"stableagent/dashboard/pages/*.py" = ["E402"]
